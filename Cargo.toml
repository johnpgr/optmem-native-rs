[package]
name = "optmem"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Native port of the OptMem CLI (memo)"
license = "MIT"
publish = false

[[bin]]
name = "memo"
path = "src/main.rs"

[dependencies]
regex = "1.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
